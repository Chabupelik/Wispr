name: CI/CD Pipeline

on:
  push:
    branches: ["main"]

jobs:
  validate:
    name: "Syntax & Integrity Check"
    runs-on: ubuntu-latest
    outputs:
      start_time: ${{ steps.timer.outputs.start_time }}
    steps:
      - name: Start timer
        id: timer
        run: echo "start_time=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Check Python syntax
        run: python -m py_compile telegram_bot/bot.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check Node.js syntax
        run: node --check backend/src/index.js

  deploy:
    name: "Deploy Backend & Bot to VPS"
    runs-on: ubuntu-latest
    needs: [validate]

    steps:
      - name: Deploy containers via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ vars.SERVER_PORT || 22 }}
          script: |
            set -e
            if [ ! -d ~/Wispr/.git ]; then
              git clone https://github.com/Chabupelik/Wispr.git ~/Wispr
            fi
            cd ~/Wispr
            git sparse-checkout init --cone
            git sparse-checkout set backend telegram_bot docker-compose.yml Dockerfile database.sql .dockerignore
            git fetch origin main
            git reset --hard origin/main
            docker compose up -d --build
            docker image prune -f

  notify:
    name: "Telegram notification"
    runs-on: ubuntu-latest
    needs: [validate, deploy]
    if: always()
    steps:
      - name: Send Telegram message
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TG_NOTIFY_CHAT_ID }}
          REPO_NAME: ${{ github.event.repository.name }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          VALIDATE_STATUS: ${{ needs.validate.result }}
          DEPLOY_STATUS: ${{ needs.deploy.result }}
          START_TIME: ${{ needs.validate.outputs.start_time }}
        run: |
          REPO_NAME="${REPO_NAME:-${GITHUB_REPOSITORY#*/}}"
          SHORT_SHA="${COMMIT_SHA:0:7}"
          COMMIT_URL="${REPO_URL}/commit/${COMMIT_SHA}"
          CLEAN_MSG=$(echo "${COMMIT_MSG:-manual}" | head -n 1)

          esc() {
            echo "$1" | sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g'
          }

          fmt_status() {
            case "$1" in
              success) echo "✅ Успешно" ;;
              failure) echo "❌ Ошибка" ;;
              cancelled) echo "⚠️ Отменено" ;;
              skipped) echo "⏭️ Пропущено" ;;
              *) echo "$1" ;;
            esac
          }

          if [ "$DEPLOY_STATUS" = "success" ]; then
            STATUS_TEXT="✅ <b>Задеплоено успешно</b>"
          elif [ "$VALIDATE_STATUS" = "failure" ]; then
            STATUS_TEXT="❌ <b>Ошибка валидации кода</b>"
          elif [ "$DEPLOY_STATUS" = "failure" ]; then
            STATUS_TEXT="❌ <b>Деплой на VPS упал</b>"
          elif [ "$VALIDATE_STATUS" = "cancelled" ] || [ "$DEPLOY_STATUS" = "cancelled" ]; then
            STATUS_TEXT="⚠️ <b>Пайплайн отменён</b>"
          else
            STATUS_TEXT="❌ <b>Пайплайн завершился с ошибкой</b>"
          fi

          START_TS="${START_TIME//[!0-9]/}"
          if [ -z "$START_TS" ]; then
            START_TS=$(date +%s)
          fi
          END_TS=$(date +%s)
          DURATION=$((END_TS - START_TS))
          if [ "$DURATION" -lt 0 ]; then
            DURATION=0
          fi
          MIN=$((DURATION / 60))
          SEC=$((DURATION % 60))
          if [ "$MIN" -gt 0 ]; then
            DURATION_TEXT="${MIN}м ${SEC}с"
          else
            DURATION_TEXT="${SEC}с"
          fi
          START_FMT=$(TZ="Europe/Moscow" date -d "@${START_TS}" +"%H:%M:%S")
          END_FMT=$(TZ="Europe/Moscow" date -d "@${END_TS}" +"%H:%M:%S")

          VAL_TEXT=$(fmt_status "$VALIDATE_STATUS")
          DEPLOY_TEXT=$(fmt_status "$DEPLOY_STATUS")

          NL=$'\n'
          MSG="🚀 <b><a href=\"${REPO_URL}\">$(esc "$REPO_NAME")</a> | CI/CD</b>${NL}"
          MSG="${MSG}Статус: ${STATUS_TEXT}${NL}${NL}"
          MSG="${MSG}🌿 <b>Ветка:</b> <code>$(esc "$BRANCH")</code>${NL}"
          MSG="${MSG}📦 <b>Коммит:</b> <a href=\"${COMMIT_URL}\"><code>${SHORT_SHA}</code></a>${NL}"
          MSG="${MSG}💬 <b>Инфо:</b> $(esc "$CLEAN_MSG")${NL}"
          MSG="${MSG}👤 <b>Автор:</b> $(esc "$ACTOR")${NL}${NL}"
          MSG="${MSG}📊 <b>Этапы:</b>${NL}"
          MSG="${MSG}• Валидация кода: ${VAL_TEXT}${NL}"
          MSG="${MSG}• Деплой на VPS: ${DEPLOY_TEXT}${NL}${NL}"
          MSG="${MSG}⏱ <b>Время:</b> ${START_FMT} → ${END_FMT} МСК (${DURATION_TEXT})${NL}"
          MSG="${MSG}🔗 <a href=\"${RUN_URL}\">Открыть в GitHub Actions</a>"

          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -d chat_id="${CHAT_ID}" \
            --data-urlencode "text=${MSG}" \
            -d parse_mode="HTML" \
            -d disable_web_page_preview="true"
